name: Build Horizons APK

# Builds the Horizons web editor and packages it as an installable Android APK
# using Capacitor, then publishes it to GitHub Releases.
# The APK is self-signed (keystore generated in CI) — sideload-ready.

on:
  workflow_dispatch:
  push:
    branches:
      - Instance_panel-z_order
    paths-ignore:
      - '**.md'
      - 'Core/**'
      - 'GDJS/**'
      - 'Extensions/**'
      - 'ExtLibs/**'

permissions:
  contents: write

jobs:
  build-web:
    name: Build Horizons web editor
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install editor dependencies
        working-directory: newIDE/app
        run: |
          # The external editors (piskel/jfxr/yarn) are committed to the repo,
          # so no GitHub release download is needed for them. Retry the full
          # install anyway: transient 5xx from npm or the libGD.js S3 bucket
          # must not kill the build.
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt/4) — waiting 45s before retrying"
            sleep 45
          done
          echo '::error::npm ci failed after 4 attempts — falling back to npm install'
          npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Build web editor (downloads prebuilt libGD.js from upstream S3)
        working-directory: newIDE/app
        run: npm run build
        env:
          CI: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Bundle the GDJS game runtime into the build (offline preview + exports)
        run: |
          cp -r newIDE/app/resources/GDJS/Runtime newIDE/app/build/Runtime
          du -sh newIDE/app/build/Runtime

      - name: Regenerate service worker against real build output (full offline precache)
        working-directory: newIDE/app/scripts
        run: SW_BUILD_DIR=../build node make-service-worker.js

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: newIDE/app/build
          retention-days: 7

  build-apk:
    name: Package APK with Capacitor
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Create Capacitor project
        run: |
          mkdir -p capacitor-app
          cd capacitor-app
          npm init -y > /dev/null
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6 --no-audit --no-fund
          mkdir -p www
          cp -r ../web-build/* www/
          npx cap init "Horizons" "com.kesurage.horizons" --web-dir www
          npx cap add android
          # Serve over https://localhost so web APIs (IndexedDB, crypto) work,
          # route fetch through native to avoid any CORS issue with AI providers,
          # and keep the screen active while the editor is open.
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            config.server = { androidScheme: 'https', cleartext: false };
            config.android = { allowMixedContent: false, webContentsDebuggingEnabled: true };
            config.plugins = { CapacitorHttp: { enabled: true } };
            config.backgroundColor = '#252525';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          "
          npx cap sync android
          # Harden the Gradle wrapper for flaky networks: use the smaller
          # -bin distribution (no sources/docs) and raise the wrapper's read
          # timeout from its 10s default — services.gradle.org regularly
          # exceeds it and kills the build with "Downloading ... failed:
          # timeout (10000ms)".
          sed -i 's|-all\.zip|-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=180000' >> android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate signing keystore
        working-directory: capacitor-app/android
        run: |
          keytool -genkeypair -v \
            -keystore horizons-release.keystore \
            -alias horizons \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass horizons2026 -keypass horizons2026 \
            -dname "CN=Horizons, OU=Games, O=Kesurage, C=US"

      - name: Build signed release APK
        working-directory: capacitor-app/android
        run: |
          chmod +x gradlew
          # The first attempt downloads the Gradle distribution and all
          # Maven/AGP dependencies — retry so transient timeouts don't kill
          # the build.
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/horizons-release.keystore \
              -Pandroid.injected.signing.store.password=horizons2026 \
              -Pandroid.injected.signing.key.alias=horizons \
              -Pandroid.injected.signing.key.password=horizons2026 \
              --no-daemon --stacktrace; then
              exit 0
            fi
            echo "::warning::gradlew failed (attempt $attempt/3) — waiting 60s before retrying"
            sleep 60
          done
          echo '::error::gradle assembleRelease failed after 3 attempts'
          exit 1

      - name: Rename APK
        run: |
          mkdir -p release
          cp capacitor-app/android/app/build/outputs/apk/release/app-release.apk release/Horizons-v0.2.4.apk
          ls -la release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizons-apk
          path: release/Horizons-v0.2.4.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.4
          name: Horizons V.0.2.4 — parallel AI team (builder + researcher), overload-proof, offline
          body: |
            ## Horizons V.0.2.4 APK — the AI team now works in PARALLEL

            Install: download `Horizons-v0.2.4.apk` on your Android device and open it (allow "install from unknown sources").

            ### What was really going on with "rate limit" and "no response"

            Your key was fine all along — two separate engine bugs made it look broken:

            1. **"Rate limit is over" on GLM**: Z.ai's *free* flash servers are globally shared and regularly answer `429 — "The service may be temporarily overloaded"` (Z.ai code **1305**). That is Z.ai being busy, NOT your quota and NOT your key — which is exactly why the same key tested "fine and fast" elsewhere. The app used to show it as a scary rate-limit error after one try. **Now it auto-retries patiently (up to 4 attempts) with a visible "Z.ai's free servers are momentarily busy — retrying" status.**
            2. **Gemini never responding**: some requests could hang forever with no timeout ever firing. All AI networking now goes through a new fetch core with a **guaranteed watchdog timeout** — every request always answers.
            3. **Over-throttling**: the previous build assumed "5 req/min, ONE request at a time" and paced every GLM request 12+ seconds apart. GLM 4.7 Flash actually allows bursts. Pacing is now **adaptive**: fast when the provider is healthy, backs off automatically when it returns real rate limits (code 1302), recovers after successes.

            ### The Multi-AI team is now a real TEAM, not a fallback chain

            You asked for both AIs working together on different jobs — done (architecture inspired by [DeepSeek Harness](https://github.com/deepseek-ai/deepseek-harness), MIT):

            - **GLM = Builder**: implements your request with tools (objects, events, behaviors) — as before.
            - **Gemini = Researcher**: starts **at the same time** on the same request — asset/UX suggestions, gameplay polish, pitfalls to avoid — on its own provider and rate window (never stealing GLM's).
            - The builder receives the researcher's notes mid-build and uses them; the final answer carries them, clearly labelled ("Team researcher — worked in parallel").
            - The chat now shows **live team status** while working (who is building, who is researching, retries, queueing) instead of a silent "Thinking...".
            - Failover remains as a safety net when a provider is truly down.

            ### GDevelop cloud services removed (offline + privacy)

            All GDevelop cloud services are gone except the **extension shop**: no more Firebase accounts, no PostHog analytics, no AI-settings CDN fetch, no cloud AI presets — nothing phones home. Everything (projects, AI with YOUR keys, history, exports) stays on-device. The extension shop and example templates (static files from GitHub) remain.

            ### Also in this release

            - Precise error messages per Z.ai code: 1305 (servers busy — key fine), 1302 (rate limit — other apps with the same key count too), 1113 (model not free / balance), 1311 (plan lacks model), 1310/1308 (usage window — resets automatically)
            - "Test Connection" retries transient provider conditions instead of failing on the first busy moment
            - Old installs migrate to the new adaptive settings automatically

            ### Setup (BYOK — bring your own keys)

            1. Get free keys: [Z.ai](https://z.ai) (GLM 4.7 Flash — free) and [Google AI Studio](https://aistudio.google.com) (Gemini Flash — free tier)
            2. In the app: Preferences → AI Provider → paste your GLM key **and** your Gemini key (Multi-AI Team) — that's what unlocks the parallel team
            3. Press **Test**. If Z.ai's free servers are momentarily busy, you'll see the automatic retry instead of an error.
          draft: false
          prerelease: false
          files: release/Horizons-v0.2.4.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
