name: Build Horizons APK

# Builds the Horizons web editor and packages it as an installable Android APK
# using Capacitor, then publishes it to GitHub Releases.
# The APK is self-signed (keystore generated in CI) — sideload-ready.

on:
  workflow_dispatch:
  push:
    branches:
      - Instance_panel-z_order
    paths-ignore:
      - '**.md'
      - 'Core/**'
      - 'GDJS/**'
      - 'ExtLibs/**'

permissions:
  contents: write

jobs:
  build-web:
    name: Build Horizons web editor
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install editor dependencies
        working-directory: newIDE/app
        run: |
          # The external editors (piskel/jfxr/yarn) are committed to the repo,
          # so no GitHub release download is needed for them. Retry the full
          # install anyway: transient 5xx from npm or the libGD.js S3 bucket
          # must not kill the build.
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt/4) — waiting 45s before retrying"
            sleep 45
          done
          echo '::error::npm ci failed after 4 attempts — falling back to npm install'
          npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Build web editor (downloads prebuilt libGD.js from upstream S3)
        working-directory: newIDE/app
        run: npm run build
        env:
          CI: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Bundle the GDJS game runtime into the build (offline preview + exports)
        run: |
          cp -r newIDE/app/resources/GDJS/Runtime newIDE/app/build/Runtime
          du -sh newIDE/app/build/Runtime

      - name: Regenerate service worker against real build output (full offline precache)
        working-directory: newIDE/app/scripts
        run: SW_BUILD_DIR=../build node make-service-worker.js

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: newIDE/app/build
          retention-days: 7

  build-apk:
    name: Package APK with Capacitor
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Create Capacitor project
        run: |
          mkdir -p capacitor-app
          cd capacitor-app
          npm init -y > /dev/null
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6 --no-audit --no-fund
          mkdir -p www
          cp -r ../web-build/* www/
          npx cap init "Horizons" "com.kesurage.horizons" --web-dir www
          npx cap add android
          # Serve over https://localhost so web APIs (IndexedDB, crypto) work
          # and keep the screen active while the editor is open.
          # CapacitorHttp stays DISABLED globally: both supported AI providers
          # (Z.ai and Google AI Studio) allow CORS from https://localhost, so
          # the WebView's own fetch works for them — while local requests
          # (preview files, /Runtime, service worker) MUST go through the
          # WebView's normal network stack to reach the app assets. AI calls
          # that fail at the network level are still retried once through the
          # native CapacitorHttp plugin (CORS-free) by the AI network core.
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            config.server = { androidScheme: 'https', cleartext: false };
            config.android = { allowMixedContent: false, webContentsDebuggingEnabled: true };
            config.plugins = { CapacitorHttp: { enabled: false } };
            config.backgroundColor = '#252525';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          "
          npx cap sync android
          # Make the soft keyboard RESIZE the WebView instead of covering it,
          # so inputs in embedded editors (Yarn dialogue editor, preview
          # debugger, ...) stay visible while typing on Android.
          sed -i 's|android:name=".MainActivity"|& android:windowSoftInputMode="adjustResize"|' android/app/src/main/AndroidManifest.xml
          grep -n "windowSoftInputMode\|MainActivity" android/app/src/main/AndroidManifest.xml || true
          # Harden the Gradle wrapper for flaky networks: use the smaller
          # -bin distribution (no sources/docs) and raise the wrapper's read
          # timeout from its 10s default — services.gradle.org regularly
          # exceeds it and kills the build with "Downloading ... failed:
          # timeout (10000ms)".
          sed -i 's|-all\.zip|-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=180000' >> android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate signing keystore
        working-directory: capacitor-app/android
        run: |
          keytool -genkeypair -v \
            -keystore horizons-release.keystore \
            -alias horizons \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass horizons2026 -keypass horizons2026 \
            -dname "CN=Horizons, OU=Games, O=Kesurage, C=US"

      - name: Build signed release APK
        working-directory: capacitor-app/android
        run: |
          chmod +x gradlew
          # The first attempt downloads the Gradle distribution and all
          # Maven/AGP dependencies — retry so transient timeouts don't kill
          # the build.
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/horizons-release.keystore \
              -Pandroid.injected.signing.store.password=horizons2026 \
              -Pandroid.injected.signing.key.alias=horizons \
              -Pandroid.injected.signing.key.password=horizons2026 \
              --no-daemon --stacktrace; then
              exit 0
            fi
            echo "::warning::gradlew failed (attempt $attempt/3) — waiting 60s before retrying"
            sleep 60
          done
          echo '::error::gradle assembleRelease failed after 3 attempts'
          exit 1

      - name: Rename APK
        run: |
          mkdir -p release
          cp capacitor-app/android/app/build/outputs/apk/release/app-release.apk release/Horizons-v0.2.7.apk
          ls -la release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizons-apk
          path: release/Horizons-v0.2.7.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.7
          name: Horizons V.0.2.7 — the AI can write events, real instruction knowledge, visible teamwork
          body: |
            ## Horizons V.0.2.7 APK

Install: download `Horizons-v0.2.7.apk` on your Android device and open it (allow "install from unknown sources").

### The AI can finally write events, code and extensions

Three independent bugs were blocking every attempt — all fixed:

1. **The fatal format bug**: the AI was instructed to return its events wrapped as `{"events": [...]}` — but the engine reads that shape as an EMPTY list. Every event the AI generated was silently thrown away, so it retried in a different format, failed again, and burned your requests. The apply pipeline now accepts every shape and the guide asks for the right one.
2. **The AI was blind to your project**: the "project digest" it received parsed wrong keys, so it saw NO scenes, NO objects, NO variables — it literally knew nothing about your game. It now sees the full structure: scenes, objects (with behaviors and animations), variables, layers and what is placed where.
3. **Guessed instruction names**: the AI invented instructions ("ParticleSystem might have bullet functionality…"). It now receives the **real list of available conditions/actions** — exact names, exact parameter counts — enumerated live from the engine, filtered to YOUR project's objects and behaviors. If it still uses an unknown instruction, it gets told the closest real one and fixes it in a single retry.

### Real teamwork — Gemini participates on every request

- While GLM builds, Gemini researches an implementation plan in parallel (its notes are injected into the builder's work).
- When GLM finishes, **Gemini reviews the result** against your request and its verdict appears in the chat and the team channel.

### Your requests last longer

- Events now apply on the first attempt (no more retry storms).
- The AI batches independent tool calls and is capped at 14 tool calls per request, then wraps up with a summary — protecting your free-tier limits.

### Setup (BYOK — bring your own keys)

            1. Get free keys: [Z.ai](https://z.ai) (GLM 4.7 Flash — free) and [Google AI Studio](https://aistudio.google.com) (Gemini Flash — free tier)
            2. In the app: Preferences → AI Provider → paste your GLM key **and** your Gemini key (Multi-AI Team) — that's what unlocks the parallel team
            3. Press **Test**. If Z.ai's free servers are momentarily busy, you'll see the automatic retry instead of an error.
          draft: false
          prerelease: false
          files: release/Horizons-v0.2.7.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
