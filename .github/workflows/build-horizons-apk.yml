name: Build Horizons APK

# Builds the Horizons web editor and packages it as an installable Android APK
# using Capacitor, then publishes it to GitHub Releases.
# The APK is self-signed (keystore generated in CI) — sideload-ready.

on:
  workflow_dispatch:
  push:
    branches:
      - Instance_panel-z_order
    paths-ignore:
      - '**.md'
      - 'Core/**'
      - 'GDJS/**'
      - 'ExtLibs/**'

permissions:
  contents: write

jobs:
  build-web:
    name: Build Horizons web editor
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install editor dependencies
        working-directory: newIDE/app
        run: |
          # The external editors (piskel/jfxr/yarn) are committed to the repo,
          # so no GitHub release download is needed for them. Retry the full
          # install anyway: transient 5xx from npm or the libGD.js S3 bucket
          # must not kill the build.
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt/4) — waiting 45s before retrying"
            sleep 45
          done
          echo '::error::npm ci failed after 4 attempts — falling back to npm install'
          npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Build web editor (downloads prebuilt libGD.js from upstream S3)
        working-directory: newIDE/app
        run: npm run build
        env:
          CI: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Bundle the GDJS game runtime into the build (offline preview + exports)
        run: |
          cp -r newIDE/app/resources/GDJS/Runtime newIDE/app/build/Runtime
          du -sh newIDE/app/build/Runtime

      - name: Regenerate service worker against real build output (full offline precache)
        working-directory: newIDE/app/scripts
        run: SW_BUILD_DIR=../build node make-service-worker.js

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: newIDE/app/build
          retention-days: 7

  build-apk:
    name: Package APK with Capacitor
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Create Capacitor project
        run: |
          mkdir -p capacitor-app
          cd capacitor-app
          npm init -y > /dev/null
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6 --no-audit --no-fund
          mkdir -p www
          cp -r ../web-build/* www/
          npx cap init "Horizons" "com.kesurage.horizons" --web-dir www
          npx cap add android
          # Serve over https://localhost so web APIs (IndexedDB, crypto) work
          # and keep the screen active while the editor is open.
          # CapacitorHttp stays DISABLED globally: both supported AI providers
          # (Z.ai and Google AI Studio) allow CORS from https://localhost, so
          # the WebView's own fetch works for them — while local requests
          # (preview files, /Runtime, service worker) MUST go through the
          # WebView's normal network stack to reach the app assets. AI calls
          # that fail at the network level are still retried once through the
          # native CapacitorHttp plugin (CORS-free) by the AI network core.
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            config.server = { androidScheme: 'https', cleartext: false };
            config.android = { allowMixedContent: false, webContentsDebuggingEnabled: true };
            config.plugins = { CapacitorHttp: { enabled: false } };
            config.backgroundColor = '#252525';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          "
          npx cap sync android
          # ----------------------------------------------------------------
          # Agent Bridge: register the native plugin (HTTP server that an
          # external AI agent can drive with a token) into the generated
          # Android project. Sources live in android-app/bridge-src in the
          # repository; the CI regenerates the Capacitor project from
          # scratch on every build, so everything is copied in here.
          # ----------------------------------------------------------------
          mkdir -p android/app/src/main/java/com/kesurage/horizons/bridge
          cp ../android-app/bridge-src/com/kesurage/horizons/bridge/BridgeServerPlugin.java \
            android/app/src/main/java/com/kesurage/horizons/bridge/BridgeServerPlugin.java
          cp ../android-app/bridge-src/MainActivity.java \
            android/app/src/main/java/com/kesurage/horizons/MainActivity.java
          # NanoHTTPD (BSD licensed, tiny) powers the embedded bridge server.
          sed -i "/implementation project(':capacitor-android')/a\\    implementation \"org.nanohttpd:nanohttpd:2.3.1\"" android/app/build.gradle
          grep -n "nanohttpd" android/app/build.gradle
          grep -n "BridgeServerPlugin" android/app/src/main/java/com/kesurage/horizons/MainActivity.java
          # Make the soft keyboard RESIZE the WebView instead of covering it,
          # so inputs in embedded editors (Yarn dialogue editor, preview
          # debugger, ...) stay visible while typing on Android.
          sed -i 's|android:name=".MainActivity"|& android:windowSoftInputMode="adjustResize"|' android/app/src/main/AndroidManifest.xml
          grep -n "windowSoftInputMode\|MainActivity" android/app/src/main/AndroidManifest.xml || true
          # Harden the Gradle wrapper for flaky networks: use the smaller
          # -bin distribution (no sources/docs) and raise the wrapper's read
          # timeout from its 10s default — services.gradle.org regularly
          # exceeds it and kills the build with "Downloading ... failed:
          # timeout (10000ms)".
          sed -i 's|-all\.zip|-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=180000' >> android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate signing keystore
        working-directory: capacitor-app/android
        run: |
          keytool -genkeypair -v \
            -keystore horizons-release.keystore \
            -alias horizons \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass horizons2026 -keypass horizons2026 \
            -dname "CN=Horizons, OU=Games, O=Kesurage, C=US"

      - name: Build signed release APK
        working-directory: capacitor-app/android
        run: |
          chmod +x gradlew
          # The first attempt downloads the Gradle distribution and all
          # Maven/AGP dependencies — retry so transient timeouts don't kill
          # the build.
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/horizons-release.keystore \
              -Pandroid.injected.signing.store.password=horizons2026 \
              -Pandroid.injected.signing.key.alias=horizons \
              -Pandroid.injected.signing.key.password=horizons2026 \
              --no-daemon --stacktrace; then
              exit 0
            fi
            echo "::warning::gradlew failed (attempt $attempt/3) — waiting 60s before retrying"
            sleep 60
          done
          echo '::error::gradle assembleRelease failed after 3 attempts'
          exit 1

      - name: Rename APK
        run: |
          mkdir -p release
          cp capacitor-app/android/app/build/outputs/apk/release/app-release.apk release/Horizons-v0.3.0.apk
          ls -la release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizons-apk
          path: release/Horizons-v0.3.0.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: Horizons V.0.3.0 — the Agent Bridge: any AI can now drive the app itself
          body: |
            ## Horizons V.0.3.0 APK

            Install: download `Horizons-v0.3.0.apk` on your Android device and open it (allow "install from unknown sources").

            ### The Agent Bridge — no more API keys, no more free-tier limits

            The built-in AI needed paid/free-tier API keys and ran out of requests. The Agent Bridge removes the middleman entirely:

            1. Open the **AI panel** and press **Start Bridge**.
            2. The app creates a local server on your device **with its own access token** (like a modern GitHub token, generated automatically).
            3. Give the URL + token to **any AI agent** — for example in another chat. The agent can then read your whole project (scenes, objects, events, variables), write events, objects and extensions, save the project, and see everything it did in a live log — while you keep the app open and watch.

            This is the "remote BYOK agent": the intelligence lives on the agent side (which already has its own AI), the app just exposes its workflow over a token-protected API. **Zero API keys needed in the app.**

            ### What the agent can do through the bridge

            - Browse the project: scenes, objects, variables, layers, resources, extensions — as compact digests or full JSON.
            - Read any scene's events as readable text or raw JSON.
            - Write events with the same validated pipeline the built-in AI uses (unknown instructions get diagnostics with the closest real one).
            - Create/replace objects, create scenes, install extensions from JSON.
            - Save the project (to your device storage), open a scene in the editor, post progress notes.
            - Run small snippets with full editor access for anything else (the `/eval` escape hatch).
            - Every change is backed up — `POST /revert` rolls back a bad batch.

            ### Two access modes

            - **LAN (default, always works):** any device on the same Wi-Fi (or `adb reverse tcp:8090 tcp:8090` from your PC) can reach the bridge.
            - **Public URL (experimental button):** the app connects to the free localtunnel service (no account, no key) so a cloud agent can reach your phone from anywhere. If the free tunnel service is busy, LAN still works.

            ### Also in this release

            - The built-in multi-AI chat (GLM + Gemini, BYOK) is still there for offline use — but it is no longer the only way: the bridge needs no keys at all.
            - Keep-screen-on while the bridge runs, so long agent sessions don't get interrupted.
          draft: false
          prerelease: false
          files: release/Horizons-v0.3.0.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
